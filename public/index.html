<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>MAVKaesu Arena 0.1.5 Ultra Stable</title>
  <style>
    :root{--cyan:#16dfff;--red:#ff4968;--gold:#ffd166;--panel:rgba(7,9,28,.86);--line:rgba(255,255,255,.16)}
    *{box-sizing:border-box;user-select:none;-webkit-user-select:none;touch-action:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050714;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit}
    #root{position:fixed;inset:0;overflow:hidden;background:#050714}#stage{position:absolute;inset:0;overflow:hidden;background:#050714}#stage.forceLandscape{width:100vh;height:100vw;left:0;top:0;transform-origin:top left;transform:rotate(90deg) translateY(-100%)}canvas{display:block;width:100%;height:100%;background:#060816}
    .screen{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.45)}.hidden{display:none!important}.card{width:min(900px,96vw);max-height:94vh;overflow:auto;border:1px solid var(--line);border-radius:24px;background:var(--panel);padding:16px;box-shadow:0 18px 70px rgba(0,0,0,.42)}h1{margin:0 0 4px;font-size:clamp(26px,6vw,50px);line-height:1}.sub{margin:0 0 12px;color:rgba(255,255,255,.72);font-size:13px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}}
    .hero{min-height:112px;text-align:left;color:#fff;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.06);padding:11px;position:relative;overflow:hidden}.hero.selected{border-color:var(--cyan);box-shadow:0 0 0 2px rgba(22,223,255,.16)}.hero strong{display:block;font-size:16px}.hero span{display:block;margin-top:4px;color:rgba(255,255,255,.7);font-size:12px}.glyph{position:absolute;right:10px;bottom:8px;font-size:34px;opacity:.88}.row{display:flex;gap:9px;flex-wrap:wrap;margin-top:10px}input{flex:1 1 170px;min-width:0;border:1px solid var(--line);border-radius:15px;background:rgba(0,0,0,.34);color:#fff;padding:12px 13px;outline:0}.btn{border:1px solid var(--line);border-radius:15px;background:rgba(255,255,255,.1);color:#fff;font-weight:800;padding:11px 13px}.btn.primary{background:rgba(22,223,255,.23);border-color:rgba(22,223,255,.38)}.btn.gold{background:rgba(255,209,102,.22);border-color:rgba(255,209,102,.36)}.status{margin-top:10px;color:rgba(255,255,255,.76);font-size:13px;min-height:21px}.note{margin-top:8px;font-size:12px;color:rgba(255,255,255,.58)}
    #hud{position:fixed;left:0;right:0;top:0;z-index:11;padding:8px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}.pill{pointer-events:auto;border:1px solid rgba(255,255,255,.15);border-radius:999px;background:rgba(0,0,0,.45);padding:7px 10px;font-size:12px}.hudBtns{display:flex;gap:6px;pointer-events:auto}.mini{border:1px solid rgba(255,255,255,.16);border-radius:999px;background:rgba(255,255,255,.08);color:#fff;font-weight:800;font-size:12px;padding:7px 9px}
    #controls{position:fixed;inset:0;z-index:12;pointer-events:none}#joyBase{position:absolute;left:max(16px,env(safe-area-inset-left));bottom:max(18px,env(safe-area-inset-bottom));width:154px;height:154px;border-radius:50%;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.15);pointer-events:auto}#joyStick{position:absolute;left:51px;top:51px;width:52px;height:52px;border-radius:50%;background:#16dfff;border:2px solid rgba(255,255,255,.55)}
    .atkCluster{position:absolute;right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));width:230px;height:210px;pointer-events:auto}.skill{position:absolute;border-radius:50%;border:2px solid rgba(255,255,255,.24);background:rgba(255,122,26,.34);color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center}.skill.aiming{filter:brightness(1.28);transform:scale(.96)}.skill .cd{display:none;position:absolute;inset:0;border-radius:50%;align-items:center;justify-content:center;background:rgba(0,0,0,.58);font-size:15px}.skill.cool .cd{display:flex}#basic{width:82px;height:82px;right:0;bottom:50px}#s1{width:63px;height:63px;right:92px;bottom:86px;background:rgba(22,223,255,.27)}#s2{width:63px;height:63px;right:96px;bottom:12px;background:rgba(170,105,255,.3)}#ult{width:72px;height:72px;right:8px;bottom:140px;background:rgba(255,209,102,.3)}#aimLine{position:fixed;z-index:30;height:5px;width:80px;border-radius:999px;background:#16dfff;transform-origin:left center;display:none;pointer-events:none}#toast{position:fixed;left:50%;bottom:18px;z-index:40;transform:translateX(-50%);max-width:92vw;background:rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:9px 13px;font-size:13px;text-align:center;opacity:0;transition:opacity .18s}.show{opacity:1!important}
  </style>
</head>
<body>
<div id="root">
  <div id="stage"><canvas id="game"></canvas></div>
  <div id="hud" class="hidden"><div class="pill" id="hudInfo">-</div><div class="hudBtns"><button class="mini" id="immersiveBtn">Imersivo</button><button class="mini" id="landBtn">Landscape</button><button class="mini" id="lowBtn">Desempenho</button><button class="mini" id="leaveBtn">Sair</button></div></div>
  <div id="controls" class="hidden"><div id="joyBase"><div id="joyStick"></div></div><div class="atkCluster"><button class="skill" id="ult" data-slot="ult">ULT<div class="cd"></div></button><button class="skill" id="s1" data-slot="skill1">Q<div class="cd"></div></button><button class="skill" id="s2" data-slot="skill2">W<div class="cd"></div></button><button class="skill" id="basic" data-slot="basic">ATK<div class="cd"></div></button></div></div>
  <div id="aimLine"></div><div id="toast"></div>
  <section id="menu" class="screen"><div class="card"><h1>MAVKaesu Arena 0.1.5</h1><p class="sub">Ultra Stable Cloudflare Edition. Menos pacotes, menos objetos, mais jogável no celular.</p><div class="grid" id="heroGrid"><button class="hero selected" data-hero="votenot"><strong>VotenoT</strong><span>Chamas, escudo e controle de área.</span><div class="glyph">🔥</div></button><button class="hero" data-hero="astro"><strong>Astro</strong><span>Portais, cura e mobilidade.</span><div class="glyph">🌀</div></button><button class="hero" data-hero="akane"><strong>Akane</strong><span>Sangue: dano e cura.</span><div class="glyph">🩸</div></button><button class="hero" data-hero="shadow"><strong>Shadow</strong><span>Espada, dash e furtividade.</span><div class="glyph">🌙</div></button></div><div class="row"><input id="nameInput" maxlength="18" placeholder="Digite seu nome" autocomplete="off"><input id="roomInput" maxlength="18" placeholder="Código da sala" autocomplete="off"></div><div class="row"><button class="btn primary" id="createBtn">Criar sala</button><button class="btn" id="joinBtn">Entrar na sala</button><button class="btn gold" id="readyBtn" disabled>Pronto</button></div><div class="status" id="status">Status: aguardando.</div><div class="note">Segure ATK/Q/W/ULT, arraste e solte para mirar. Toque rápido usa autoaim.</div></div></section>
</div>
<script>
"use strict";
const $=id=>document.getElementById(id),canvas=$("game"),ctx=canvas.getContext("2d",{alpha:false}),stage=$("stage"),menu=$("menu"),controls=$("controls"),hud=$("hud"),hudInfo=$("hudInfo"),statusEl=$("status"),toast=$("toast"),aimLine=$("aimLine"),nameInput=$("nameInput"),roomInput=$("roomInput"),createBtn=$("createBtn"),joinBtn=$("joinBtn"),readyBtn=$("readyBtn"),immersiveBtn=$("immersiveBtn"),landBtn=$("landBtn"),lowBtn=$("lowBtn"),leaveBtn=$("leaveBtn"),joyBase=$("joyBase"),joyStick=$("joyStick"),skillButtons=[...document.querySelectorAll(".skill")];
const heroColors={votenot:"#ff7a1a",astro:"#b86bff",akane:"#ff2f61",shadow:"#8d97ff"};
let ws=null,myId=null,roomCode="",selectedHero="votenot",state=null,connected=false,ping=0,fps=0,frames=0,fpsT=performance.now(),lastFrame=0,low=true,forceLandscape=false,lastInput=0,lastPing=0,lastServerMsg=0;const input={x:0,y:0};
function show(text,ms=1600){toast.textContent=text;toast.classList.add("show");clearTimeout(show.t);show.t=setTimeout(()=>toast.classList.remove("show"),ms)}function setStatus(t){statusEl.textContent=t}function cleanCode(c){return String(c||"").toUpperCase().replace(/[^A-Z0-9_-]/g,"").slice(0,18)}function randomCode(){let a="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",s="MAV";for(let i=0;i<4;i++)s+=a[Math.floor(Math.random()*a.length)];return s}
function wsUrl(code){const proto=location.protocol==="https:"?"wss:":"ws:";return `${proto}//${location.host}/ws/${encodeURIComponent(code)}?name=${encodeURIComponent(nameInput.value||"Jogador")}&hero=${encodeURIComponent(selectedHero)}`}function send(msg){if(ws&&ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify(msg))}function disconnect(){if(ws){try{ws.close()}catch{}}ws=null;connected=false}
function connect(code){code=cleanCode(code);if(code.length<3)return show("Código inválido.");disconnect();roomCode=code;roomInput.value=code;setStatus("Conectando...");try{ws=new WebSocket(wsUrl(code))}catch{setStatus("WebSocket falhou. Abra pelo link do Worker.");return}ws.onopen=()=>{connected=true;lastServerMsg=performance.now();readyBtn.disabled=false;menu.classList.add("hidden");controls.classList.remove("hidden");hud.classList.remove("hidden");setStatus(`Conectado. Sala ${code}`);show("Conectado!")};ws.onmessage=e=>{lastServerMsg=performance.now();let msg;try{msg=JSON.parse(e.data)}catch{return}if(msg.type==="welcome"){myId=msg.id;state=msg.state}if(msg.type==="state")state=msg.state;if(msg.type==="system")show(msg.text);if(msg.type==="gameOver")show(msg.text,3200);if(msg.type==="pong")ping=Math.round(performance.now()-(msg.t||performance.now()))};ws.onclose=()=>{connected=false;readyBtn.disabled=true;setStatus("Desconectado.");show("Conexão encerrada.")};ws.onerror=()=>{setStatus("Erro de WebSocket.");show("Erro de conexão.")}}
createBtn.onclick=()=>connect(randomCode());joinBtn.onclick=()=>connect(roomInput.value);readyBtn.onclick=()=>{send({type:"ready"});show("Pronto!")};leaveBtn.onclick=()=>{disconnect();menu.classList.remove("hidden");controls.classList.add("hidden");hud.classList.add("hidden")};
document.getElementById("heroGrid").onclick=e=>{const b=e.target.closest(".hero");if(!b)return;selectedHero=b.dataset.hero;document.querySelectorAll(".hero").forEach(x=>x.classList.toggle("selected",x===b));send({type:"choose",hero:selectedHero})};
immersiveBtn.onclick=async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();if(screen.orientation&&screen.orientation.lock)try{await screen.orientation.lock("landscape")}catch{}show("Modo imersivo solicitado.")}catch{show("Seu navegador bloqueou o modo imersivo.")}};landBtn.onclick=()=>{forceLandscape=!forceLandscape;stage.classList.toggle("forceLandscape",forceLandscape);setTimeout(resize,80)};lowBtn.onclick=()=>{low=!low;show(low?"Modo desempenho ligado.":"Modo desempenho desligado.")};
function resize(){const r=stage.getBoundingClientRect();const q=low?0.75:1;canvas.width=Math.max(480,Math.min(960,Math.floor(r.width*q)));canvas.height=Math.max(270,Math.min(540,Math.floor(r.height*q)))}addEventListener("resize",resize);resize();
let joyId=null;function joy(e){const r=joyBase.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const max=48,len=Math.hypot(dx,dy);if(len>max){dx=dx/len*max;dy=dy/len*max}joyStick.style.left=51+dx+"px";joyStick.style.top=51+dy+"px";input.x=Math.abs(dx)<7?0:dx/max;input.y=Math.abs(dy)<7?0:dy/max;sendInput(true)}joyBase.onpointerdown=e=>{joyId=e.pointerId;joyBase.setPointerCapture(joyId);joy(e)};joyBase.onpointermove=e=>{if(e.pointerId===joyId)joy(e)};function resetJoy(){joyId=null;input.x=0;input.y=0;joyStick.style.left="51px";joyStick.style.top="51px";sendInput(true)}joyBase.onpointerup=e=>{if(e.pointerId===joyId)resetJoy()};joyBase.onpointercancel=resetJoy;
function sendInput(force=false){const t=performance.now();if(!connected)return;if(!force&&t-lastInput<120)return;lastInput=t;send({type:"input",x:+input.x.toFixed(2),y:+input.y.toFixed(2)})}setInterval(()=>{if(!connected)return;sendInput(false);const t=performance.now();if(t-lastPing>1000){lastPing=t;send({type:"ping",t})}if(t-lastServerMsg>5000)show("Sem resposta do servidor há alguns segundos.",1100)},120);
let aim=null;function beginAim(btn,e){const r=btn.getBoundingClientRect();aim={id:e.pointerId,slot:btn.dataset.slot,sx:r.left+r.width/2,sy:r.top+r.height/2,x:e.clientX,y:e.clientY,btn};btn.classList.add("aiming");btn.setPointerCapture(e.pointerId);drawAim()}function moveAim(e){if(!aim||e.pointerId!==aim.id)return;aim.x=e.clientX;aim.y=e.clientY;drawAim()}function endAim(e){if(!aim||e.pointerId!==aim.id)return;const dx=aim.x-aim.sx,dy=aim.y-aim.sy,len=Math.hypot(dx,dy),dir=len<18?autoAim():{x:dx/len,y:dy/len};send({type:"attack",slot:aim.slot,dx:+dir.x.toFixed(3),dy:+dir.y.toFixed(3)});aim.btn.classList.remove("aiming");aim=null;aimLine.style.display="none"}function drawAim(){if(!aim)return;const dx=aim.x-aim.sx,dy=aim.y-aim.sy,len=Math.min(126,Math.max(28,Math.hypot(dx,dy))),a=Math.atan2(dy,dx);aimLine.style.display="block";aimLine.style.width=len+"px";aimLine.style.transform=`translate(${aim.sx}px,${aim.sy}px) rotate(${a}rad)`}skillButtons.forEach(b=>{b.onpointerdown=e=>beginAim(b,e);b.onpointermove=moveAim;b.onpointerup=endAim;b.onpointercancel=()=>{if(aim){aim.btn.classList.remove("aiming");aim=null;aimLine.style.display="none"}}});
function me(){return state?.players?.find(p=>p.id===myId)||null}function autoAim(){const p=me();if(!p||!state)return{x:1,y:0};let best=null,bd=1e9;const arr=[...(state.players||[]).filter(x=>x.team!==p.team&&!x.dead),...(state.minions||[]).filter(x=>x.team!==p.team),...(state.towers||[]).filter(x=>x.team!==p.team&&x.alive),state.cores?.[p.team==="blue"?"red":"blue"]].filter(Boolean);for(const o of arr){const dd=(o.x-p.x)**2+(o.y-p.y)**2;if(dd<bd){bd=dd;best=o}}if(!best)return{x:p.team==="blue"?1:-1,y:0};const dx=best.x-p.x,dy=best.y-p.y,l=Math.hypot(dx,dy)||1;return{x:dx/l,y:dy/l}}
function scale(){const m=state?.map||{width:960,height:540};return{x:canvas.width/m.width,y:canvas.height/m.height}}function hp(x,y,w,hp,max,c){ctx.fillStyle="#220b13";ctx.fillRect(x-w/2,y,w,6);ctx.fillStyle=c;ctx.fillRect(x-w/2,y,w*Math.max(0,hp/max),6)}
function draw(t){requestAnimationFrame(draw);if(t-lastFrame<(low?40:33))return;lastFrame=t;frames++;if(t-fpsT>=1000){fps=frames;frames=0;fpsT=t}ctx.fillStyle="#060816";ctx.fillRect(0,0,canvas.width,canvas.height);drawBg();if(state)drawGame();else center("MAVKaesu Arena","Crie ou entre em uma sala.");}
function drawBg(){const w=canvas.width,h=canvas.height;ctx.fillStyle="rgba(22,223,255,.07)";ctx.fillRect(0,0,w/2,h);ctx.fillStyle="rgba(255,73,104,.07)";ctx.fillRect(w/2,0,w/2,h);ctx.strokeStyle="rgba(255,255,255,.12)";ctx.lineWidth=Math.max(10,h*.045);ctx.beginPath();ctx.moveTo(w*.08,h*.5);ctx.lineTo(w*.92,h*.5);ctx.stroke();}
function drawGame(){const s=scale();drawCore(state.cores?.blue,s);drawCore(state.cores?.red,s);for(const a of state.areas||[])drawArea(a,s);for(const tw of state.towers||[])drawTower(tw,s);for(const m of state.minions||[])drawMinion(m,s);for(const pr of state.projectiles||[])drawProjectile(pr,s);for(const p of state.players||[])drawPlayer(p,s);updateCD();const p=me();hudInfo.textContent=`Sala ${state.room||roomCode} | Ping ${ping}ms | FPS ${fps} | Obj ${state.counts?state.counts.m+state.counts.pr+state.counts.a:0} | ${p?p.heroLabel:"?"}`;if(state.winner)center(state.winner==="blue"?"Azul venceu!":"Vermelho venceu!","Núcleo destruído.")}
function drawCore(c,s){if(!c||!c.alive)return;const x=c.x*s.x,y=c.y*s.y,r=c.r*Math.min(s.x,s.y),col=c.team==="blue"?"#16dfff":"#ff4968";ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.fillStyle="#050714";ctx.fillRect(x-r*.45,y-r*.45,r*.9,r*.9);hp(x,y+r+8,r*2,c.hp,c.maxHp,col)}function drawTower(o,s){if(!o.alive)return;const x=o.x*s.x,y=o.y*s.y,r=25*Math.min(s.x,s.y),col=o.team==="blue"?"#16dfff":"#ff4968";ctx.fillStyle=col;ctx.fillRect(x-r*.55,y-r,r*1.1,r*2);hp(x,y+r+8,r*1.7,o.hp,o.maxHp,col)}function drawMinion(o,s){const x=o.x*s.x,y=o.y*s.y,r=11*Math.min(s.x,s.y),col=o.team==="blue"?"#16dfff":"#ff4968";ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();hp(x,y+r+4,r*2,o.hp,o.maxHp,col)}function drawArea(o,s){const x=o.x*s.x,y=o.y*s.y,r=o.r*Math.min(s.x,s.y);ctx.globalAlpha=.22;ctx.fillStyle=o.color||"#fff";ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}function drawProjectile(o,s){const x=o.x*s.x,y=o.y*s.y,r=Math.max(4,o.r*Math.min(s.x,s.y));ctx.fillStyle=o.color||"#fff";ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}function drawPlayer(p,s){const x=p.x*s.x,y=p.y*s.y,r=(p.id===myId?19:16)*Math.min(s.x,s.y),col=heroColors[p.hero]||"#fff",team=p.team==="blue"?"#16dfff":"#ff4968";ctx.globalAlpha=p.stealth&&p.id!==myId?.45:1;ctx.fillStyle=team;ctx.beginPath();ctx.arc(x,y,r+4,0,Math.PI*2);ctx.fill();ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;if(p.hero==="shadow"){ctx.strokeStyle="#dce2ff";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x+r*.2,y-r);ctx.lineTo(x+r*1.1,y-r*1.8);ctx.stroke()}if(p.shield>0){ctx.strokeStyle="rgba(255,255,255,.75)";ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,r+8,0,Math.PI*2);ctx.stroke()}ctx.fillStyle="#fff";ctx.font="12px system-ui";ctx.textAlign="center";ctx.fillText(p.id===myId?"Você":p.name,x,y-r-10);hp(x,y+r+8,r*2.2,p.hp,p.maxHp,team);if(p.dead){ctx.fillStyle="#fff";ctx.fillText("KO",x,y+4)}}function center(a,b){ctx.fillStyle="rgba(0,0,0,.5)";ctx.fillRect(canvas.width/2-170,canvas.height/2-50,340,100);ctx.textAlign="center";ctx.fillStyle="#fff";ctx.font="bold 28px system-ui";ctx.fillText(a,canvas.width/2,canvas.height/2-8);ctx.font="15px system-ui";ctx.fillStyle="rgba(255,255,255,.75)";ctx.fillText(b,canvas.width/2,canvas.height/2+24)}function updateCD(){const p=me();if(!p)return;for(const b of skillButtons){const slot=b.dataset.slot,cd=p.cds?.[slot]||0,c=b.querySelector(".cd");if(cd>100){b.classList.add("cool");c.textContent=(cd/1000).toFixed(cd>9500?0:1)}else{b.classList.remove("cool");c.textContent=""}}}
const keys=new Set();addEventListener("keydown",e=>{keys.add(e.key.toLowerCase());if(e.key===" "){const d=autoAim();send({type:"attack",slot:"basic",dx:d.x,dy:d.y})}if(e.key.toLowerCase()==="q"){const d=autoAim();send({type:"attack",slot:"skill1",dx:d.x,dy:d.y})}if(e.key.toLowerCase()==="w"){const d=autoAim();send({type:"attack",slot:"skill2",dx:d.x,dy:d.y})}if(e.key.toLowerCase()==="e"){const d=autoAim();send({type:"attack",slot:"ult",dx:d.x,dy:d.y})}});addEventListener("keyup",e=>keys.delete(e.key.toLowerCase()));setInterval(()=>{let x=0,y=0;if(keys.has("a")||keys.has("arrowleft"))x--;if(keys.has("d")||keys.has("arrowright"))x++;if(keys.has("w")||keys.has("arrowup"))y--;if(keys.has("s")||keys.has("arrowdown"))y++;if(x||y){const l=Math.hypot(x,y)||1;input.x=x/l;input.y=y/l;sendInput(true)}},120);
requestAnimationFrame(draw);
</script>

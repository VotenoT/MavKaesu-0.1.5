<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>MAVKaesu Arena 0.1.5 - Cloudflare Edition</title>
  <style>
    :root{--bg:#060712;--panel:rgba(8,10,28,.84);--line:rgba(255,255,255,.15);--cyan:#15e5ff;--red:#ff4665;--gold:#ffd166;--purple:#a56bff;--green:#55ff88}
    *{box-sizing:border-box;user-select:none;-webkit-user-select:none;touch-action:none} html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#060712;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif} button,input{font:inherit}
    #root{position:fixed;inset:0;overflow:hidden;background:radial-gradient(circle at 20% 20%,rgba(21,229,255,.16),transparent 30%),radial-gradient(circle at 82% 78%,rgba(255,70,101,.14),transparent 36%),linear-gradient(135deg,#050713,#10132d 45%,#090717)}
    #gameStage{position:absolute;inset:0;overflow:hidden;background:#050713} #gameStage.forceLandscape{width:100vh;height:100vw;transform-origin:top left;transform:rotate(90deg) translateY(-100%);left:0;top:0} canvas{width:100%;height:100%;display:block;background:#060712}
    .screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:18px;z-index:20;background:radial-gradient(circle at top,rgba(21,229,255,.14),transparent 42%),rgba(0,0,0,.38);backdrop-filter:blur(10px)} .hidden{display:none!important}
    .card{width:min(940px,96vw);max-height:94vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:26px;box-shadow:0 20px 70px rgba(0,0,0,.45);padding:18px}.title{margin:0 0 5px;font-size:clamp(26px,6vw,52px);letter-spacing:.5px;line-height:1}.subtitle{margin:0 0 14px;color:rgba(255,255,255,.72);font-size:14px}
    .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}@media(max-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
    .hero{min-height:132px;padding:12px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.06);position:relative;overflow:hidden;color:white;text-align:left}.hero.selected{border-color:var(--cyan);box-shadow:0 0 0 2px rgba(21,229,255,.17),0 0 30px rgba(21,229,255,.18)}.hero strong{display:block;font-size:17px;margin-bottom:4px}.hero span{color:rgba(255,255,255,.72);font-size:12px}.heroGlyph{position:absolute;right:10px;bottom:7px;font-size:42px;filter:drop-shadow(0 0 16px currentColor);opacity:.92}
    .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px} input{flex:1 1 180px;min-width:0;padding:13px 14px;background:rgba(0,0,0,.38);color:white;border:1px solid var(--line);border-radius:16px;outline:none}.btn{border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:12px 14px;background:rgba(255,255,255,.09);color:white;font-weight:800}.btn.primary{background:linear-gradient(135deg,rgba(21,229,255,.34),rgba(80,122,255,.32));border-color:rgba(21,229,255,.42)}.btn.gold{background:linear-gradient(135deg,rgba(255,209,102,.33),rgba(255,122,26,.23));border-color:rgba(255,209,102,.4)}.status{margin-top:12px;min-height:22px;color:rgba(255,255,255,.78);font-size:13px}.note{font-size:12px;color:rgba(255,255,255,.64);margin-top:10px}
    #hud{position:fixed;left:env(safe-area-inset-left,0);right:env(safe-area-inset-right,0);top:env(safe-area-inset-top,0);padding:8px 10px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;z-index:10;pointer-events:none}.pill{pointer-events:auto;background:rgba(0,0,0,.42);border:1px solid rgba(255,255,255,.13);border-radius:999px;padding:8px 10px;font-size:12px;backdrop-filter:blur(8px);box-shadow:0 8px 24px rgba(0,0,0,.22)}.hudButtons{display:flex;gap:6px;pointer-events:auto}.miniBtn{border:1px solid rgba(255,255,255,.17);background:rgba(255,255,255,.08);color:white;border-radius:999px;padding:8px 10px;font-size:12px;font-weight:800}
    #controls{position:fixed;inset:0;z-index:12;pointer-events:none}#joyBase{position:absolute;left:max(18px,env(safe-area-inset-left));bottom:max(20px,env(safe-area-inset-bottom));width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(21,229,255,.16),rgba(255,255,255,.05));border:2px solid rgba(255,255,255,.16);pointer-events:auto}#joyStick{position:absolute;left:52px;top:52px;width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#fff,#15e5ff 35%,#2357ff 100%);box-shadow:0 0 22px rgba(21,229,255,.52);border:2px solid rgba(255,255,255,.52)}
    .atkCluster{position:absolute;right:max(18px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));width:230px;height:210px;pointer-events:auto}.skill{position:absolute;border-radius:50%;border:2px solid rgba(255,255,255,.24);color:white;font-weight:900;background:radial-gradient(circle at 35% 25%,rgba(255,255,255,.22),rgba(255,122,26,.32) 55%,rgba(0,0,0,.28));box-shadow:0 0 28px rgba(255,122,26,.22);display:flex;align-items:center;justify-content:center;text-align:center;line-height:1}.skill:active,.skill.aiming{transform:scale(.96);filter:brightness(1.2)}.skill .cd{position:absolute;inset:0;border-radius:50%;background:rgba(0,0,0,.56);display:none;align-items:center;justify-content:center;font-size:16px}.skill.cooling .cd{display:flex}#btnBasic{width:82px;height:82px;right:0;bottom:52px;font-size:17px}#btnS1{width:64px;height:64px;right:90px;bottom:86px;background:radial-gradient(circle at 35% 25%,rgba(255,255,255,.22),rgba(21,229,255,.30) 55%,rgba(0,0,0,.28))}#btnS2{width:64px;height:64px;right:96px;bottom:12px;background:radial-gradient(circle at 35% 25%,rgba(255,255,255,.22),rgba(165,107,255,.34) 55%,rgba(0,0,0,.28))}#btnUlt{width:72px;height:72px;right:8px;bottom:142px;background:radial-gradient(circle at 35% 25%,rgba(255,255,255,.24),rgba(255,209,102,.36) 55%,rgba(0,0,0,.3))}
    #aimLine{position:fixed;left:0;top:0;width:100px;height:5px;background:linear-gradient(90deg,rgba(255,255,255,.15),rgba(21,229,255,.95));box-shadow:0 0 18px rgba(21,229,255,.8);border-radius:999px;transform-origin:left center;z-index:30;pointer-events:none;display:none}#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);max-width:min(680px,92vw);padding:10px 14px;border-radius:999px;background:rgba(0,0,0,.62);border:1px solid rgba(255,255,255,.14);color:white;z-index:40;font-size:13px;text-align:center;pointer-events:none;opacity:0;transition:opacity .18s}#toast.show{opacity:1}
  </style>
</head>
<body>
  <div id="root">
    <div id="gameStage"><canvas id="game" width="960" height="540"></canvas></div>
    <div id="hud" class="hidden"><div class="pill" id="hudInfo">Sala: -</div><div class="hudButtons"><button class="miniBtn" id="immersiveBtn">Imersivo</button><button class="miniBtn" id="landscapeBtn">Landscape</button><button class="miniBtn" id="leaveBtn">Sair</button></div></div>
    <div id="controls" class="hidden"><div id="joyBase"><div id="joyStick"></div></div><div class="atkCluster"><button class="skill" id="btnUlt" data-slot="ult">ULT<div class="cd"></div></button><button class="skill" id="btnS1" data-slot="skill1">Q<div class="cd"></div></button><button class="skill" id="btnS2" data-slot="skill2">W<div class="cd"></div></button><button class="skill" id="btnBasic" data-slot="basic">ATK<div class="cd"></div></button></div></div>
    <div id="aimLine"></div><div id="toast"></div>
    <section id="menu" class="screen"><div class="card"><h1 class="title">MAVKaesu Arena 0.1.5</h1><p class="subtitle">Cloudflare Edition: salas via WebSocket + Durable Objects. Sem Socket.IO.</p><div class="grid" id="heroGrid"><button class="hero selected" data-hero="votenot"><strong>VotenoT</strong><span>Controle com chamas, escudo e Olho Ciano.</span><div class="heroGlyph" style="color:#ff7a1a">🔥</div></button><button class="hero" data-hero="astro"><strong>Astro</strong><span>Suporte com portais, blink e campo estelar.</span><div class="heroGlyph" style="color:#b85cff">🌀</div></button><button class="hero" data-hero="akane"><strong>Akane</strong><span>Ataca-cura com sangue, maré e drenagem.</span><div class="heroGlyph" style="color:#ff2f61">🩸</div></button><button class="hero" data-hero="shadow"><strong>Shadow</strong><span>Espada curta, dash, camuflagem e Lua Negra.</span><div class="heroGlyph" style="color:#9da7ff">🌙</div></button></div><div class="row"><input id="nameInput" maxlength="18" placeholder="Digite seu nome" autocomplete="off" /><input id="roomInput" maxlength="18" placeholder="Código da sala" autocomplete="off" /></div><div class="row"><button class="btn primary" id="createBtn">Criar sala</button><button class="btn" id="joinBtn">Entrar na sala</button><button class="btn gold" id="readyBtn" disabled>Pronto</button></div><div class="status" id="status">Status: desconectado.</div><div class="note">Dica: segure ATK/Q/W/ULT, arraste para mirar e solte. Toque rápido usa autoaim.</div></div></section>
  </div>
  <script>
    "use strict";
    const canvas=document.getElementById("game"),ctx=canvas.getContext("2d",{alpha:false}),stage=document.getElementById("gameStage"),menu=document.getElementById("menu"),controls=document.getElementById("controls"),hud=document.getElementById("hud"),hudInfo=document.getElementById("hudInfo"),statusEl=document.getElementById("status"),toastEl=document.getElementById("toast"),aimLine=document.getElementById("aimLine"),nameInput=document.getElementById("nameInput"),roomInput=document.getElementById("roomInput"),createBtn=document.getElementById("createBtn"),joinBtn=document.getElementById("joinBtn"),readyBtn=document.getElementById("readyBtn"),immersiveBtn=document.getElementById("immersiveBtn"),landscapeBtn=document.getElementById("landscapeBtn"),leaveBtn=document.getElementById("leaveBtn"),joyBase=document.getElementById("joyBase"),joyStick=document.getElementById("joyStick"),skillButtons=[...document.querySelectorAll(".skill")];
    const HERO_DRAW={votenot:{color:"#ff7a1a",accent:"#22e7ff"},astro:{color:"#b85cff",accent:"#f0aaff"},akane:{color:"#ff2f61",accent:"#ff9ab2"},shadow:{color:"#7e8cff",accent:"#cbd2ff"}};
    let ws=null,myId=null,roomCode="",selectedHero="votenot",state=null,forceLandscape=false,toastTimer=0,pingMs=0,fps=0,frames=0,fpsLast=performance.now(),lastInputSent=0,connected=false; const input={x:0,y:0};
    function showToast(text,ms=1800){toastEl.textContent=text;toastEl.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove("show"),ms)} function setStatus(text){statusEl.textContent=text} function cleanRoomCode(code){return String(code||"").toUpperCase().replace(/[^A-Z0-9_-]/g,"").slice(0,18)}
    function randomRoomCode(){const a="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let o="MAV";for(let i=0;i<4;i++)o+=a[Math.floor(Math.random()*a.length)];return o} function wsUrl(code){const proto=location.protocol==="https:"?"wss:":"ws:",name=encodeURIComponent((nameInput.value||"Jogador").trim().slice(0,18)||"Jogador"),hero=encodeURIComponent(selectedHero);return `${proto}//${location.host}/ws/${encodeURIComponent(code)}?name=${name}&hero=${hero}`}
    function connect(code){code=cleanRoomCode(code);if(code.length<3)return showToast("Código de sala inválido.");disconnect();roomCode=code;roomInput.value=code;setStatus(`Conectando na sala ${code}...`);try{ws=new WebSocket(wsUrl(code))}catch(err){setStatus("Erro ao criar WebSocket. Abra pelo link do Worker, não por arquivo local.");return showToast("WebSocket falhou.")}
      ws.addEventListener("open",()=>{connected=true;setStatus(`Conectado. Sala: ${code}`);readyBtn.disabled=false;menu.classList.add("hidden");controls.classList.remove("hidden");hud.classList.remove("hidden");showToast("Conectado à arena!");send({type:"choose",hero:selectedHero})});
      ws.addEventListener("message",event=>{let msg;try{msg=JSON.parse(event.data)}catch{return} if(msg.type==="welcome"){myId=msg.id;state=msg.state} if(msg.type==="state")state=msg.state; if(msg.type==="system")showToast(msg.text); if(msg.type==="gameOver")showToast(msg.text,4500); if(msg.type==="pong")pingMs=Math.max(0,Math.round(performance.now()-msg.t)); if(msg.type==="error")showToast(msg.text)});
      ws.addEventListener("close",()=>{connected=false;readyBtn.disabled=true;setStatus("Desconectado.");showToast("Conexão encerrada.")}); ws.addEventListener("error",()=>{setStatus("Erro de conexão. Verifique se o Worker foi publicado corretamente.");showToast("Erro no WebSocket.")})}
    function disconnect(){if(ws){try{ws.close()}catch{}} ws=null;connected=false} function send(msg){if(ws&&ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify(msg))}
    document.getElementById("heroGrid").addEventListener("click",e=>{const heroBtn=e.target.closest(".hero");if(!heroBtn)return;selectedHero=heroBtn.dataset.hero;document.querySelectorAll(".hero").forEach(el=>el.classList.toggle("selected",el===heroBtn));if(connected)send({type:"choose",hero:selectedHero})});
    createBtn.onclick=()=>connect(randomRoomCode()); joinBtn.onclick=()=>connect(roomInput.value); readyBtn.onclick=()=>{send({type:"ready"});showToast("Você está pronto!")}; leaveBtn.onclick=()=>{disconnect();menu.classList.remove("hidden");controls.classList.add("hidden");hud.classList.add("hidden")};
    immersiveBtn.onclick=async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen(); if(screen.orientation&&screen.orientation.lock){try{await screen.orientation.lock("landscape")}catch{}} showToast("Modo imersivo ativado.")}catch{showToast("Seu navegador bloqueou o modo imersivo.")}}; landscapeBtn.onclick=()=>{forceLandscape=!forceLandscape;stage.classList.toggle("forceLandscape",forceLandscape);resizeCanvas();showToast(forceLandscape?"Landscape visual ativado.":"Landscape visual desligado.")};
    function resizeCanvas(){const r=stage.getBoundingClientRect(),scale=Math.min(1.35,window.devicePixelRatio||1);canvas.width=Math.floor(Math.max(480,r.width*scale));canvas.height=Math.floor(Math.max(270,r.height*scale))} window.addEventListener("resize",resizeCanvas);resizeCanvas();
    let joyPointer=null;function updateJoyFromEvent(e){const r=joyBase.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const max=50,len=Math.hypot(dx,dy);if(len>max){dx=dx/len*max;dy=dy/len*max}joyStick.style.left=`${52+dx}px`;joyStick.style.top=`${52+dy}px`;input.x=Math.abs(dx)<8?0:dx/max;input.y=Math.abs(dy)<8?0:dy/max}
    joyBase.addEventListener("pointerdown",e=>{joyPointer=e.pointerId;joyBase.setPointerCapture(joyPointer);updateJoyFromEvent(e)});joyBase.addEventListener("pointermove",e=>{if(e.pointerId!==joyPointer)return;updateJoyFromEvent(e)});function resetJoy(){joyPointer=null;input.x=0;input.y=0;joyStick.style.left="52px";joyStick.style.top="52px";sendInput(true)} joyBase.addEventListener("pointerup",e=>{if(e.pointerId===joyPointer)resetJoy()});joyBase.addEventListener("pointercancel",resetJoy);
    function sendInput(force=false){const t=performance.now();if(!force&&t-lastInputSent<50)return;lastInputSent=t;send({type:"input",x:input.x,y:input.y})} setInterval(()=>{if(connected){sendInput(false);send({type:"ping",t:performance.now()})}},250);
    let aim=null;function beginAim(btn,e){const r=btn.getBoundingClientRect();aim={pointerId:e.pointerId,slot:btn.dataset.slot,sx:r.left+r.width/2,sy:r.top+r.height/2,x:e.clientX,y:e.clientY,btn};btn.classList.add("aiming");btn.setPointerCapture(e.pointerId);updateAimLine()}function moveAim(e){if(!aim||e.pointerId!==aim.pointerId)return;aim.x=e.clientX;aim.y=e.clientY;updateAimLine()}function endAim(e){if(!aim||e.pointerId!==aim.pointerId)return;const dx=aim.x-aim.sx,dy=aim.y-aim.sy,len=Math.hypot(dx,dy),dir=len<18?autoAimDir():{x:dx/len,y:dy/len};send({type:"attack",slot:aim.slot,dx:+dir.x.toFixed(3),dy:+dir.y.toFixed(3)});aim.btn.classList.remove("aiming");aimLine.style.display="none";aim=null}function updateAimLine(){if(!aim)return;const dx=aim.x-aim.sx,dy=aim.y-aim.sy,len=Math.min(130,Math.max(28,Math.hypot(dx,dy))),angle=Math.atan2(dy,dx);aimLine.style.display="block";aimLine.style.width=`${len}px`;aimLine.style.transform=`translate(${aim.sx}px,${aim.sy}px) rotate(${angle}rad)`}
    for(const btn of skillButtons){btn.addEventListener("pointerdown",e=>beginAim(btn,e));btn.addEventListener("pointermove",moveAim);btn.addEventListener("pointerup",endAim);btn.addEventListener("pointercancel",()=>{if(aim){aim.btn.classList.remove("aiming");aimLine.style.display="none";aim=null}})}
    function getMe(){return state?.players?.find(p=>p.id===myId)||null} function autoAimDir(){const me=getMe();if(!me||!state)return{x:1,y:0};let best=null,bestD=Infinity;const enemies=[...(state.players||[]).filter(p=>p.team!==me.team&&!p.dead),...(state.minions||[]).filter(m=>m.team!==me.team),...(state.towers||[]).filter(t=>t.team!==me.team&&t.alive),state.cores?.[me.team==="blue"?"red":"blue"]].filter(Boolean);for(const e of enemies){const d=(e.x-me.x)**2+(e.y-me.y)**2;if(d<bestD){bestD=d;best=e}}if(!best)return{x:me.team==="blue"?1:-1,y:0};const dx=best.x-me.x,dy=best.y-me.y,len=Math.hypot(dx,dy)||1;return{x:dx/len,y:dy/len}}
    function getScale(){const map=state?.map||{width:960,height:540};return{x:canvas.width/map.width,y:canvas.height/map.height}}function roundRect(x,y,w,h,r){if(ctx.roundRect){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}else{ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y)}}
    function draw(){frames++;const t=performance.now();if(t-fpsLast>=1000){fps=frames;frames=0;fpsLast=t}drawBackground();if(state){drawMapObjects();updateCooldownUI();const me=getMe();hudInfo.textContent=`Sala: ${state.room||roomCode} | Ping: ${pingMs}ms | FPS: ${fps} | ${me?me.heroLabel:"?"}`}else drawCenterText("MAVKaesu Arena","Crie ou entre em uma sala para jogar.");requestAnimationFrame(draw)}
    function drawBackground(){const w=canvas.width,h=canvas.height;ctx.fillStyle="#060712";ctx.fillRect(0,0,w,h);const grd=ctx.createLinearGradient(0,0,w,h);grd.addColorStop(0,"#0d1740");grd.addColorStop(.52,"#11142c");grd.addColorStop(1,"#210916");ctx.fillStyle=grd;ctx.fillRect(0,0,w,h);ctx.strokeStyle="rgba(255,255,255,.055)";ctx.lineWidth=2;const step=Math.max(32,w/18);for(let x=0;x<w;x+=step){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x+w*.1,h);ctx.stroke()}ctx.strokeStyle="rgba(255,255,255,.09)";ctx.lineWidth=Math.max(12,h*.055);ctx.beginPath();ctx.moveTo(w*.08,h*.5);ctx.lineTo(w*.92,h*.5);ctx.stroke();ctx.fillStyle="rgba(21,229,255,.075)";ctx.fillRect(0,0,w*.5,h);ctx.fillStyle="rgba(255,70,101,.07)";ctx.fillRect(w*.5,0,w*.5,h)}
    function hpBar(x,y,w,hp,maxHp,color){ctx.fillStyle="rgba(0,0,0,.48)";roundRect(x-w/2,y,w,7,4);ctx.fill();ctx.fillStyle=color;roundRect(x-w/2,y,w*Math.max(0,hp/maxHp),7,4);ctx.fill()}function drawMapObjects(){const s=getScale();if(state.cores){drawCore(state.cores.blue,s);drawCore(state.cores.red,s)}for(const z of state.zones||[])drawZone(z,s);for(const tw of state.towers||[])drawTower(tw,s);for(const m of state.minions||[])drawMinion(m,s);for(const p of state.players||[])drawPlayer(p,s);for(const pr of state.projectiles||[])drawProjectile(pr,s);for(const fx of state.effects||[])drawEffect(fx,s);if(state.winner)drawCenterText(state.winner==="blue"?"Time Azul venceu!":"Time Vermelho venceu!","Núcleo destruído.")}
    function drawCore(core,s){if(!core||!core.alive)return;const x=core.x*s.x,y=core.y*s.y,r=core.radius*Math.min(s.x,s.y),color=core.team==="blue"?"#15e5ff":"#ff4665";ctx.save();ctx.translate(x,y);ctx.rotate(performance.now()/1400*(core.team==="blue"?1:-1));ctx.fillStyle=color+"33";ctx.strokeStyle=color;ctx.lineWidth=3;for(let i=0;i<6;i++){ctx.rotate(Math.PI/3);roundRect(-r*.55,-r*.55,r*1.1,r*1.1,r*.18);ctx.fill();ctx.stroke()}ctx.restore();hpBar(x,y+r+10,r*2.2,core.hp,core.maxHp,color)}
    function drawTower(tw,s){if(!tw.alive)return;const x=tw.x*s.x,y=tw.y*s.y,color=tw.team==="blue"?"#15e5ff":"#ff4665",r=26*Math.min(s.x,s.y);ctx.fillStyle=color+"30";ctx.strokeStyle=color;ctx.lineWidth=3;roundRect(x-r*.65,y-r,r*1.3,r*2,9);ctx.fill();ctx.stroke();ctx.beginPath();ctx.arc(x,y-r*.9,r*.46,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();hpBar(x,y+r+8,r*1.8,tw.hp,tw.maxHp,color)}
    function drawMinion(m,s){const x=m.x*s.x,y=m.y*s.y,color=m.team==="blue"?"#15e5ff":"#ff4665",r=12*Math.min(s.x,s.y);ctx.fillStyle=color+"55";ctx.strokeStyle=color;ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(x+(m.team==="blue"?r*.33:-r*.33),y-r*.16,r*.18,0,Math.PI*2);ctx.fill();hpBar(x,y+r+4,r*2,m.hp,m.maxHp,color)}
    function drawPlayer(p,s){const x=p.x*s.x,y=p.y*s.y,skin=HERO_DRAW[p.hero]||HERO_DRAW.votenot,color=skin.color,teamColor=p.team==="blue"?"#15e5ff":"#ff4665",r=(p.id===myId?20:17)*Math.min(s.x,s.y);ctx.save();ctx.globalAlpha=(p.stealth&&p.id!==myId)?0.38:1;ctx.translate(x,y);ctx.fillStyle="rgba(0,0,0,.35)";ctx.beginPath();ctx.ellipse(0,r*.72,r*.92,r*.28,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle=teamColor;ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,r*1.12,0,Math.PI*2);ctx.stroke();const grd=ctx.createRadialGradient(-r*.35,-r*.35,2,0,0,r*1.4);grd.addColorStop(0,"#ffffff");grd.addColorStop(.32,skin.accent);grd.addColorStop(1,color);ctx.fillStyle=grd;ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();if(p.hero==="shadow"){ctx.fillStyle="rgba(0,0,0,.78)";ctx.beginPath();ctx.arc(0,-r*.08,r*.72,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#dce2ff";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(r*.35,-r*.9);ctx.lineTo(r*1.15,-r*1.55);ctx.stroke()}else if(p.hero==="astro"){ctx.strokeStyle="#f0aaff";ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,r*1.35,performance.now()/430,performance.now()/430+Math.PI*1.35);ctx.stroke()}else if(p.hero==="akane"){ctx.fillStyle="rgba(255,47,97,.42)";ctx.beginPath();ctx.moveTo(-r*.55,-r*.2);ctx.quadraticCurveTo(0,r*1.25,r*.55,-r*.2);ctx.fill()}else{ctx.fillStyle="rgba(255,180,43,.45)";ctx.beginPath();ctx.moveTo(-r*.5,-r*.15);ctx.quadraticCurveTo(0,-r*1.75,r*.5,-r*.15);ctx.fill();ctx.fillStyle="#22e7ff";ctx.beginPath();ctx.arc(r*.22,-r*.18,r*.17,0,Math.PI*2);ctx.fill()}if(p.shield>0){ctx.strokeStyle="rgba(255,255,255,.72)";ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,r*1.45,0,Math.PI*2);ctx.stroke()}ctx.restore();ctx.fillStyle="white";ctx.font=`${Math.max(11,r*.58)}px system-ui`;ctx.textAlign="center";ctx.fillText(p.id===myId?"Você":p.name,x,y-r*1.55);hpBar(x,y+r+8,r*2.4,p.hp,p.maxHp,p.team==="blue"?"#15e5ff":"#ff4665");if(p.dead){ctx.fillStyle="rgba(255,255,255,.7)";ctx.font=`${Math.max(14,r*.7)}px system-ui`;ctx.fillText("KO",x,y+5)}}
    function drawProjectile(pr,s){const x=pr.x*s.x,y=pr.y*s.y,r=Math.max(4,pr.radius*Math.min(s.x,s.y));ctx.fillStyle=pr.color||"#fff";ctx.shadowColor=pr.color||"#fff";ctx.shadowBlur=16;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}function drawZone(z,s){const x=z.x*s.x,y=z.y*s.y,r=z.radius*Math.min(s.x,s.y),pulse=.75+Math.sin(performance.now()/160)*.08;ctx.fillStyle=(z.color||"#fff")+"24";ctx.strokeStyle=(z.color||"#fff")+"aa";ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,r*pulse,0,Math.PI*2);ctx.fill();ctx.stroke()}function drawEffect(fx,s){const x=fx.x*s.x,y=fx.y*s.y,age=performance.now()-fx.created,k=Math.max(0,1-age/fx.life);ctx.globalAlpha=k;ctx.strokeStyle=fx.color||"#fff";ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,(1-k)*42+8,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1}
    function drawCenterText(title,sub){ctx.save();ctx.textAlign="center";ctx.fillStyle="rgba(0,0,0,.45)";roundRect(canvas.width/2-180,canvas.height/2-54,360,108,22);ctx.fill();ctx.fillStyle="white";ctx.font="bold 30px system-ui";ctx.fillText(title,canvas.width/2,canvas.height/2-10);ctx.fillStyle="rgba(255,255,255,.72)";ctx.font="15px system-ui";ctx.fillText(sub,canvas.width/2,canvas.height/2+22);ctx.restore()}function updateCooldownUI(){const me=getMe();if(!me)return;for(const btn of skillButtons){const slot=btn.dataset.slot,cd=me.cooldowns?.[slot]||0,cdEl=btn.querySelector(".cd");if(cd>100){btn.classList.add("cooling");cdEl.textContent=(cd/1000).toFixed(cd>9500?0:1)}else{btn.classList.remove("cooling");cdEl.textContent=""}}}
    const keys=new Set();window.addEventListener("keydown",e=>{keys.add(e.key.toLowerCase());if(e.key===" ")send({type:"attack",slot:"basic",...autoAimMessage()});if(e.key.toLowerCase()==="q")send({type:"attack",slot:"skill1",...autoAimMessage()});if(e.key.toLowerCase()==="w")send({type:"attack",slot:"skill2",...autoAimMessage()});if(e.key.toLowerCase()==="e")send({type:"attack",slot:"ult",...autoAimMessage()})});window.addEventListener("keyup",e=>keys.delete(e.key.toLowerCase()));function autoAimMessage(){const d=autoAimDir();return{dx:d.x,dy:d.y}}setInterval(()=>{let x=0,y=0;if(keys.has("a")||keys.has("arrowleft"))x-=1;if(keys.has("d")||keys.has("arrowright"))x+=1;if(keys.has("w")||keys.has("arrowup"))y-=1;if(keys.has("s")||keys.has("arrowdown"))y+=1;if(x||y){const len=Math.hypot(x,y)||1;input.x=x/len;input.y=y/len;sendInput(true)}},50);
    draw();
  </script>
